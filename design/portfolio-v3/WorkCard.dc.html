<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
</helmet>
<article style="display:flex;flex-wrap:wrap;gap:24px 48px;padding:40px 0;border-top:1px solid rgba(227,236,234,0.12);font-family:'Hanken Grotesk',Helvetica,sans-serif;color:#e3ecea">
  <div style="flex:1 1 260px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0">
    <div style="display:flex;flex-direction:column;gap:16px">
      <span style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#8a9c9a">{{ index }}</span>
      <h3 style="margin:0;font-weight:500;font-size:clamp(24px,2.4vw,36px);line-height:1.1;letter-spacing:-0.02em;text-wrap:balance">{{ title }}</h3>
    </div>
    <a href="{{ url }}" target="_blank" rel="noopener" style="align-self:flex-start;display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#e3ecea;padding:12px 18px;border:1px solid rgba(227,236,234,0.18);border-radius:999px;transition:background .2s,color .2s" style-hover="background:#e3ecea;color:#0a1315">{{ domain }} ↗</a>
  </div>
  <div style="flex:2 1 420px;min-width:0;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#0d181a;border:1px solid rgba(227,236,234,0.08)">
    <div style="width:100%;height:100%;transform:scale(1);transition:transform .6s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.05)">
      <image-slot id="{{ thumbId }}" shape="rect" placeholder="Drop a screenshot"></image-slot>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:520},&quot;index&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Project title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;url&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://example.org&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;example.org&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;thumbId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;work-thumb&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
